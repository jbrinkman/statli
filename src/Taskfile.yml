version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the Wails application
    cmds:
      - wails build

  dev:
    desc: Run the application in development mode
    cmds:
      - wails dev

  dev-background:
    desc: Start the application in development mode (background)
    cmds:
      - |
        if ! lsof -ti:34115 > /dev/null 2>&1; then
          echo "Starting Wails dev server in background..."
          nohup wails dev > /tmp/wails-dev.log 2>&1 &
          echo $! > /tmp/wails-dev.pid
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if lsof -ti:34115 > /dev/null 2>&1; then
              echo "Wails dev server started on port 34115"
              break
            fi
            sleep 1
          done
        else
          echo "Wails dev server already running on port 34115"
        fi
    silent: false

  stop-dev:
    desc: Stop the background development server
    cmds:
      - |
        if [ -f /tmp/wails-dev.pid ]; then
          PID=$(cat /tmp/wails-dev.pid)
          if ps -p $PID > /dev/null 2>&1; then
            echo "Stopping Wails dev server (PID: $PID)..."
            kill $PID
            rm /tmp/wails-dev.pid
          else
            echo "Process not found, cleaning up PID file..."
            rm /tmp/wails-dev.pid
          fi
        else
          # Try to find by port
          PID=$(lsof -ti:34115)
          if [ -n "$PID" ]; then
            echo "Stopping Wails dev server on port 34115 (PID: $PID)..."
            kill $PID
          else
            echo "No Wails dev server running"
          fi
        fi

  test:
    desc: Run all tests
    cmds:
      - go test -v ./...

  test-screenshot:
    desc: Run screenshot tests (automatically starts app if needed)
    deps:
      - dev-background
    env:
      WAILS_APP_RUNNING: "1"
    cmds:
      - go test -v -run TestScreenshot

  screenshot-tool:
    desc: Build the screenshot CLI tool
    cmds:
      - go build -o screenshot-tool ./cmd/screenshot
    generates:
      - screenshot-tool

  screenshot:
    desc: Take a screenshot (automatically starts app if needed)
    deps:
      - screenshot-tool
      - dev-background
    cmds:
      - ./screenshot-tool

  screenshot-custom:
    desc: Take a screenshot with custom output path (usage - task screenshot-custom OUTPUT=path.png)
    deps:
      - screenshot-tool
      - dev-background
    cmds:
      - ./screenshot-tool -output {{.OUTPUT}}
    requires:
      vars: [OUTPUT]

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf build/
      - rm -f screenshot-tool
      - go clean

  install-deps:
    desc: Install/update Go dependencies
    cmds:
      - go mod download
      - go mod tidy
